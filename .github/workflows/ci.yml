name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Browsers aren't needed: the tests only exercise the pure parsers.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Syntax check
        run: for f in src/*.js src/*/*.js scripts/*.mjs; do node --check "$f"; done
      - run: npm test
